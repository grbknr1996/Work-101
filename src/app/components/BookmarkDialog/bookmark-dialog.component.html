
<p-dialog [header]="'documentCapture.bookmarkPage' | translate" [(visible)]="visible" [modal]="true" [closable]="true" [dismissableMask]="true" (onHide)="close()" [style]="{ width: '35rem', maxHeight: '85vh' }">
  <p class="text-sm text-gray-600 mb-4">{{ 'documentCapture.bookmark.includeText' | translate }}</p>
  <p-card class="mb-4">
    <div class="flex flex-col gap-3 mb-4">
      <label class="font-semibold" for="ipTypeSelect">{{ 'documentCapture.bookmark.selectIPType' | translate }}</label>
      <p-dropdown id="ipTypeSelect" [options]="ipTypes" [(ngModel)]="selectedIpType" (onChange)="onIpTypeChange()" [placeholder]="'documentCapture.bookmark.selectIPType' | translate"></p-dropdown>
      <label class="font-semibold" for="bookmarkSelect">{{ 'documentCapture.bookmark.selectLabel' | translate }}</label>
      <p-dropdown id="bookmarkSelect" [options]="filteredBookmarkOptions" [(ngModel)]="selectedBookmark" [placeholder]="'documentCapture.bookmark.placeholder' | translate" [disabled]="!selectedIpType"></p-dropdown>
    </div>
    <div class="flex items-center gap-2 mt-2">
      <p-checkbox name="includeText" inputId="includeText" [(ngModel)]="includeBookmarkText" binary="true"></p-checkbox>
      <label class="p-checkbox-label" for="includeText">{{ 'documentCapture.bookmark.includeText' | translate }}</label>
    </div>
    <button class="p-button p-component p-button-primary w-full mt-3" type="button" pButton icon="pi pi-qrcode" [label]="'documentCapture.bookmark.generateButton' | translate" (click)="onGenerate()"></button>
  </p-card>
  <p-card class="mb-4 text-center" header="{{ 'documentCapture.bookmark.previewHeader' | translate }}">
    <div class="w-full flex flex-column justify-center items-center">
      <div class="flex justify-center items-center border-2 border-dashed border-gray-300 p-4 w-12rem h-12rem mb-2"><img *ngIf="qrImageUrl" src="assets/images/qr-mock.png" alt="QR Code" style="width:110px; height:110px;"><i class="pi pi-qrcode text-4xl text-gray-500" *ngIf="!qrImageUrl"></i></div><span class="block mb-3 font-medium text-center" *ngIf="includeBookmarkText &amp;&amp; qrImageUrl">{{ selectedBookmark }}</span>
    </div>
    <div class="flex justify-end gap-2 mt-3">
      <button class="p-button p-component p-button-info" type="button" pButton icon="pi pi-print" [label]="'documentCapture.bookmark.printButton' | translate" (click)="onPrint()"></button>
      <button class="p-button p-component p-button-secondary" type="button" pButton [label]="'documentCapture.bookmark.closeButton' | translate" (click)="close()"></button>
    </div>
  </p-card>
</p-dialog>
