<div class="package-stats-container"><p-accordion value="0"><p-accordion-panel value="0"><p-accordion-header class="stats-accordion-header">{{"common.components.stats.statistics"|translate}}</p-accordion-header><p-accordion-content class="stats-accordion-content"><div class="stats-container"><div class="package-stat-card" *ngFor="let stat of multipleStats" [class.selected]="selectedStat === stat.label" (click)="selectStat(stat.label)"><div *ngFor="let display of stat.displayLabel"><div class="stat-header"><span class="stat-label" [style.color]="stat.color">{{ display }}</span><i [class]="stat.icon" [style.color]="stat.color"></i></div></div><div class="stat-content"><span class="stat-count" [style.color]="stat.color">{{ stat.count }}</span><span class="stat-change" [style]="stat.percentChange!=null ? '' : 'display:none;'"><i [class]="stat.percentChange!=null ? (stat.percentChange &gt;= 0 ? 'pi pi-arrow-up' : 'pi pi-arrow-down') : ''" [style.color]="stat.percentChange &gt;= 0 ? '#16a34a' : '#dc2626'"></i><span [style.color]="stat.percentChange &gt;= 0 ? '#16a34a' : '#dc2626'">{{ stat.percentChange }}%</span></span></div><div class="stat-countLabel" [style.color]="stat.color">{{ stat.countLabel }}</div><div *ngFor="let period of stat.periodList"><div class="stat-period">{{ period }}</div></div></div></div></p-accordion-content></p-accordion-panel></p-accordion></div>
