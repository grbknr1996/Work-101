
<!-- Scroll to Top Button-->
<div class="scroller-container" [class.show]="showScroller" [class.hide]="!showScroller" (click)="scrollToTop()" role="button" tabindex="0" [attr.aria-label]="'Scroll to top'" (keydown.enter)="scrollToTop()" (keydown.space)="scrollToTop()"><i class="pi pi-chevron-up scroller-icon"></i>
  <div class="scroller-tooltip"><span>Back to top</span></div>
</div>
