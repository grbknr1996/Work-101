
<div class="group-assignment-card bg-white rounded-lg shadow-lg p-6 min-h-[600px]">
  <div class="card-header mb-6">
    <h2 class="text-2xl font-bold text-blue-600">Group Assignment</h2>
  </div>
  <div class="card-content">
    <div class="group-assignment-container flex gap-8">
      <div class="group-list available flex-1">
        <h3 class="text-lg font-semibold text-blue-600 mb-4">{{ availableLabel }}</h3>
        <div class="group-list-header mb-4">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" type="checkbox" [checked]="isAllAvailableSelected()" (change)="toggleSelectAllAvailable($event.target.checked)"><span class="text-sm font-medium text-gray-700">Select All</span>
          </label>
        </div>
        <div class="group-list-body bg-gray-50 rounded-lg p-4 overflow-y-auto border min-h-[400px] max-h-[400px]">
          <div class="group-item flex items-center justify-between p-3 mb-2 bg-white rounded-lg shadow-sm border border-gray-200 transition-colors hover:border-blue-300" *ngFor="let group of pagedAvailableGroups">
            <div class="flex items-center space-x-3 flex-1"><span class="drag-handle text-gray-400 cursor-move text-lg">⋮⋮</span>
              <div class="group-info flex-1">
                <div class="group-name font-medium text-gray-900">{{ group.name }}</div>
                <div class="group-type"><span class="inline-flex items-center rounded-full text-xs font-medium bg-blue-100 text-blue-800 px-2.5 py-0.5">{{ group.type }}</span></div>
              </div>
            </div>
            <input class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" type="checkbox" [checked]="availableSelected.has(group.id)" (change)="availableSelected.has(group.id) ? availableSelected.delete(group.id) : availableSelected.add(group.id)">
          </div>
        </div>
        <div class="mt-4">
          <p-paginator [rows]="pageSize" [totalRecords]="totalAvailableGroups" [first]="(currentAvailablePage - 1) * pageSize" (onPageChange)="onAvailablePageChange($event)" [showFirstLastIcon]="true" [showPageLinks]="true" [showCurrentPageReport]="false" styleClass="[10, 25, 50]"></p-paginator>
        </div>
      </div>
      <div class="group-list-controls center-controls flex flex-col justify-center space-y-4">
        <button class="move-btn w-12 h-12 bg-blue-500 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-blue-600 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed" (click)="moveToAssigned()" [disabled]="availableSelected.size === 0"><i class="pi pi-angle-right text-lg"></i></button>
        <button class="move-btn w-12 h-12 bg-red-500 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed" (click)="moveToAvailable()" [disabled]="assignedSelected.size === 0"><i class="pi pi-angle-left text-lg"></i></button>
      </div>
      <div class="group-list assigned flex-1">
        <h3 class="text-lg font-semibold text-blue-600 mb-4">{{ assignedLabel }}</h3>
        <div class="group-list-header mb-4">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" type="checkbox" [checked]="isAllAssignedSelected()" (change)="toggleSelectAllAssigned($event.target.checked)"><span class="text-sm font-medium text-gray-700">Select All</span>
          </label>
        </div>
        <div class="group-list-body bg-gray-50 rounded-lg p-4 overflow-y-auto border min-h-[400px] max-h-[400px]">
          <div class="group-item flex items-center justify-between p-3 mb-2 bg-white rounded-lg shadow-sm border border-gray-200 transition-colors hover:border-green-300" *ngFor="let group of pagedAssignedGroups" [class.selected]="assignedSelected.has(group.id)">
            <div class="flex items-center space-x-3 flex-1"><span class="drag-handle text-gray-400 cursor-move text-lg">⋮⋮</span>
              <div class="group-info flex-1">
                <div class="group-name font-medium text-gray-900">{{ group.name }}</div>
                <div class="group-type"><span class="inline-flex items-center rounded-full text-xs font-medium bg-green-100 text-green-800 px-2.5 py-0.5">{{ group.type }}</span></div>
              </div>
            </div>
            <input class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" type="checkbox" [checked]="assignedSelected.has(group.id)" (change)="assignedSelected.has(group.id) ? assignedSelected.delete(group.id) : assignedSelected.add(group.id)">
          </div>
          <div class="flex flex-col items-center justify-center text-gray-500 h-64" *ngIf="pagedAssignedGroups.length === 0"><i class="pi pi-users text-4xl mb-2"></i>
            <p class="text-sm">No groups assigned yet</p>
            <p class="text-xs text-gray-400">Select groups from the left panel to assign</p>
          </div>
        </div>
        <div class="mt-4">
          <p-paginator [rows]="pageSize" [totalRecords]="assignedGroups.length" [first]="assignedFirst" (onPageChange)="onAssignedPageChange($event)" [showFirstLastIcon]="true" [showPageLinks]="true" [showCurrentPageReport]="false" [rowsPerPageOptions]="[10, 25, 50]"></p-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
