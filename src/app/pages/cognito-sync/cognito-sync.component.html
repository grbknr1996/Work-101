
<div class="div flex justify-center align-items-center" style="min-height: 100vh;">
  <div class="text-center">
    <div *ngIf="!showError">
      <p-progressSpinner></p-progressSpinner>
      <p class="mt-3">{{"common.sync"|translate}}</p>
    </div>
    <div class="error-container" *ngIf="showError"><i class="pi pi-exclamation-triangle" style="font-size: 3rem; color: #f44336;"></i>
      <h3 class="mt-3 mb-2">{{"common.cognitoSync.error.title"|translate}}</h3>
      <p class="error-message mb-4">{{ errorMessage || ("common.cognitoSync.error.message"|translate) }}</p>
      <button class="p-button-primary" pButton type="button" [label]="'common.retry' | translate" icon="pi pi-refresh" (click)="retrySync()"></button>
    </div>
  </div>
</div>
