<app-layout [config]="layoutConfig"><app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs><div class="user-accounts-header"><h1>{{"renewal.title"|translate}}</h1></div><app-multiple-stats [multipleStats]="packageStats" (statSelected)="onStatSelect($event)" [selectedStat]="statSelected"></app-multiple-stats><app-configurable-filter-bar [filters]="filterConfigs" [showClearAll]="true" [showApplyButton]="true" [showFilterSelector]="true" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)" [showDateSearchBar]="true" (filterDateSearch)="filterSearch($event)" [appliedFilters]="appliedFilters" [clearAllLabel]="'common.components.filter.clearAll'|translate" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()" (removeDefaultFilter)="removeDefaultFilter($event)"></app-configurable-filter-bar><div class="flex justify-between items-center acknowledge-button"><div></div><button class="p-button-primary" pButton [disabled]="'renewal.button.sendNotification'|translate" icon="pi pi-envelope" (click)="onSendMail()"></button></div><div [style]="tableData.length &gt; 0 ? '' : 'display:none;'"><app-table [columns]="tableColumns" [data]="tableData" (selectionChange)="onSelectionChange($event)" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"> </app-table></div><div [style]="tableData.length == 0 ? 'align-self:center' : 'display:none;'"><h5>{{"renewal.table.emptyMessage"|translate}}</h5></div></app-layout>
