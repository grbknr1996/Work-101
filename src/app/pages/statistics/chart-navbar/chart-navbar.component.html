
<div class="tw-panel w-full p-3 sm:p-4 mb-4 bg-[#e5f3f7] flex flex-wrap justify-between items-center gap-3">
  <h2 class="tw-title w-full sm:w-auto text-center sm:text-left text-sm md:text-lg lg:text-xl font-semibold">{{ currentTheme }}</h2>
  <div class="tw-buttons flex flex-wrap flex-col sm:flex-row gap-3 w-full sm:w-auto justify-center sm:justify-end">
    <button class="p-button-text tw-btn" pButton icon="pi pi-sliders-h" style="color: var(--p-button-outlined-secondary-color)" (click)="filter()"></button>
    <button class="p-button-text tw-btn" pButton icon="pi pi-refresh" style="color: var(--p-button-outlined-secondary-color)" (click)="reset()"></button>
  </div>
</div>
