<div class="tw-filter-container bg-gray-100 p-4 w-full flex flex-col gap-6" *ngIf="show"><div class="tw-filter-header pb-1 mb-1 flex justify-between items-center border-b border-gray-300"><span class="tw-filter-title text-base font-semibold uppercase text-gray-800">{{ 'charts.statistics.filters.title' | translate }}</span><button class="tw-filter-close block lg:hidden text-gray-600 hover:text-gray-800 text-xl" (click)="hide()"><i class="pi pi-times"></i></button></div><div class="tw-filter-form grid grid-cols-1 md:grid-cols-3 lg:grid-cols-1 gap-4"><div class="tw-filter-section flex flex-col w-full" *ngFor="let filter of finalFilters"><label class="tw-filter-label text-base font-medium text-gray-800 mb-2" *ngIf="filter.type !== 'checkbox'">{{ filter.label }}</label><p-select *ngIf="filter.type === 'dropdown'" [options]="filter.options" [(ngModel)]="filter.model" styleClass="w-full tw-filter-select" (onChange)="anyFilter(filter)"></p-select><p-datepicker class="tw-filter-datepicker w-full !flex" *ngIf="filter.type === 'yearrange'" [(ngModel)]="filter.model" selectionMode="range" view="year" dateFormat="yy" [yearNavigator]="true" [minDate]="filter.minDate" [maxDate]="filter.maxDate" [showIcon]="true" [readonlyInput]="true" styleClass="w-full flex-1"></p-datepicker><div class="flex items-center space-x-2" *ngIf="filter.type === 'checkbox'"><p-checkbox [(ngModel)]="filter.model" [binary]="true" (onChange)="anyFilter(filter)"></p-checkbox><label class="text-sm font-semibold text-gray-700">{{ filter.label }}</label></div><div class="tw-filter-options flex flex-col gap-2" *ngIf="filter.type === 'radio'"><div class="tw-filter-option flex items-center space-x-2" *ngFor="let option of filter.options"><p-radiobutton [name]="filter.key" [value]="option.value" [(ngModel)]="filter.model" (onClick)="anyFilter(filter)"></p-radiobutton><label class="tw-filter-option-label text-sm text-gray-700">{{ option.label }}</label></div></div></div></div></div>
