
<app-layout [config]="layoutConfig">
  <app-breadcrumbs [items]="getBreadcrumbItems()"></app-breadcrumbs>
  <!-- Page Header-->
  <div class="page-header">
    <div class="header-content">
      <div class="header-title">
        <h1>Originating Offices</h1>
        <p>Manage IP offices that provide data to the WIPO system</p>
      </div>
    </div>
  </div>
  <!-- Statistics Cards-->
  <div class="stats-section">
    <p-card styleClass="stat-card">
      <div class="stat-content">
        <div class="stat-icon"><i class="pi pi-building"></i></div>
        <div class="stat-info">
          <div class="stat-number">{{ totalOfficesCount() }}</div>
          <div class="stat-label">Total Originating Offices</div>
        </div>
      </div>
    </p-card>
  </div>
  <!-- Offices Table-->
  <div class="table-section">
    <p-card header="Originating Offices" styleClass="table-card">
      <app-table [columns]="columns" [data]="filteredOffices()" [rows]="10" [paginator]="true" [loading]="false"></app-table>
    </p-card>
  </div>
</app-layout>
