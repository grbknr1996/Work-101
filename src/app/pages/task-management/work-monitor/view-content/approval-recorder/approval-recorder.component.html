<ng-container><div class="mb-4"><h2 class="text-lg font-semibold mb-2">{{ 'taskManagement.approval.backgroundTitle' | translate }}</h2><p-tree [value]="legalBackgroundItems" selectionMode="checkbox" [(selection)]="selectedLegalItems" [propagateSelectionUp]="true" [propagateSelectionDown]="true"></p-tree></div><div class="w-full p-4"><div class="grid grid-cols-1 gap-6 mb-4"><div><label class="block text-sm font-medium mb-1">{{ 'taskManagement.approval.comments' | translate }}</label><p-editor [(ngModel)]="reviewComments" [style]="{height:'150px'}"></p-editor></div><div><label class="block text-sm font-medium mb-1">{{ 'taskManagement.approval.outcomes' | translate }}</label><p-editor [(ngModel)]="actionsToOvercome" [style]="{height:'150px'}"></p-editor></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end mb-4"><div><label class="block text-sm font-medium mb-1">{{ 'taskManagement.recordAction.nextResponsibleUserUnit' | translate }}</label><p-dropdown class="w-full" [options]="units" optionLabel="unitName" optionValue="id" [(ngModel)]="selectedUnitId" (onChange)="onUnitChange($event.value)" placeholder="Select Unit"></p-dropdown></div><div><label class="block text-sm font-medium mb-1">{{ 'taskManagement.recordAction.nextResponsibleUser' | translate }}</label><p-dropdown class="w-full" [options]="members" optionLabel="name" optionValue="id" [(ngModel)]="selectedMemberId" placeholder="Select User"></p-dropdown></div><div class="flex justify-end gap-3"><p-button [label]="'taskManagement.recordAction.btn.cancel' | translate" icon="pi pi-times" (onClick)="cancelAction()"></p-button><p-button [label]="'taskManagement.recordAction.btn.submit' | translate" icon="pi pi-check" (onClick)="assignAction()"></p-button></div></div></div></ng-container>
