
<ng-container *ngIf="showLayout">
  <app-layout>
    <ng-container *ngTemplateOutlet="mainHistoryContent"></ng-container>
  </app-layout>
</ng-container>
<ng-container *ngIf="!showLayout">
  <ng-container *ngTemplateOutlet="mainHistoryContent"></ng-container>
</ng-container>
<ng-template #mainHistoryContent>
  <div class="relative">
    <div class="absolute top-0 left-9 w-0.5 bg-gray-300 h-full"></div>
    <ng-container *ngFor="let step of workflowTree">
      <ng-container *ngTemplateOutlet="stepTemplate; context: {$implicit: step, level: 0}"></ng-container>
    </ng-container>
  </div>
  <ng-template #stepTemplate let-step let-level="level">
    <div class="relative mb-6" [ngStyle]="{'margin-left.px': level * 40}">
      <div class="flex items-center gap-2 cursor-pointer" (click)="step.expanded = !step.expanded"><i class="pi w-4 text-gray-400 text-sm" [ngClass]="{'pi-chevron-right': !step.expanded, 'pi-chevron-down': step.expanded, 'opacity-50 pointer-events-none': !step.children?.length}"></i><span class="w-7 h-7 flex items-center justify-center rounded-full text-white font-semibold text-sm transition-all duration-200" [ngClass]="getDotClass(step)">•</span><span class="font-medium text-base">{{ step.label }}</span><span class="ml-2 px-2 py-0.5 text-xs rounded bg-blue-100 text-blue-800 font-semibold border border-blue-300" *ngIf="step.data?.isCurrent">Current</span><span class="ml-2 px-2 py-0.5 text-xs rounded bg-blue-100 text-blue-800 font-semibold border border-blue-300" *ngIf="hasAssignedSubtask(step) &amp;&amp; !step.expanded">Assigned to you</span></div>
      <div class="mt-3 ml-6 p-4 rounded-lg bg-gray-50 border border-gray-200" *ngIf="step.expanded">
        <div class="flex items-center gap-2 text-sm mb-3"><span [ngClass]="{'text-green-600': step.data?.status === 'Completed', 'text-blue-600': step.data?.status === 'In Progress', 'text-gray-500': step.data?.status === 'Not Started', 'text-gray-500': step.data?.status === 'Pending'}">Status: {{ step.data?.status }}</span><span class="text-gray-500" *ngIf="step.data?.duration">• {{ step.data.duration }}</span></div>
        <div class="flex items-center gap-2 mb-2">
          <ng-container *ngIf="step.data?.assignees?.length; else singleAssignee">
            <div class="flex -space-x-2"><span class="w-8 h-8 flex items-center justify-center rounded-full bg-blue-600 text-white text-sm" *ngFor="let user of step.data.assignees">{{ user }}</span></div><span class="text-sm text-gray-700">{{ step.data.users }} total users</span>
          </ng-container>
          <ng-template #singleAssignee><span class="px-3 py-1 rounded-full bg-blue-600 text-white text-xs font-medium" *ngIf="step.data?.assignee">{{ step.data.assignee }}</span><span class="ml-2 px-2 py-0.5 text-xs rounded bg-blue-100 text-blue-800 font-semibold border border-blue-300" *ngIf="step.data?.assignedToMe &amp;&amp; step.data?.status === 'In Progress'">Assigned to you</span></ng-template>
        </div>
        <p class="text-sm text-gray-700 mb-3" *ngIf="step.data?.description">{{ step.data.description }}</p>
        <div class="flex gap-3 mb-3">
          <button class="p-button-outlined p-button-sm" pButton type="button" label="Document" icon="pi pi-file"></button>
          <button class="p-button-outlined p-button-sm" pButton type="button" label="Comment" icon="pi pi-comment" (click)="toggleComments(step)"></button>
        </div>
        <div class="mt-2 p-3 rounded-md bg-white border border-gray-200" *ngIf="step.showComments">
          <ng-container *ngIf="step.data &amp;&amp; step.data.comments &amp;&amp; step.data.comments.length &gt; 0; else noComments">
            <div class="text-sm text-gray-700 mb-2 border-b border-gray-100 pb-1" *ngFor="let comment of step.data.comments">{{ comment }}</div>
          </ng-container>
          <ng-template #noComments>
            <div class="text-sm text-gray-500 italic">No comments</div>
          </ng-template>
        </div>
        <div class="text-xs text-gray-500 flex items-center" *ngIf="step.data?.date"><i class="pi pi-clock mr-1"></i>{{ step.data?.date }}</div>
        <div class="mt-4" *ngIf="step.children?.length">
          <ng-container *ngFor="let child of step.children">
            <ng-container *ngTemplateOutlet="stepTemplate; context: {$implicit: child, level: level + 1}"></ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </ng-template>
</ng-template>
