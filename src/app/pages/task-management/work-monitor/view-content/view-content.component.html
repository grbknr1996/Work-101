
<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <p-toolbar class="mb-3">
    <div class="w-full flex justify-between items-center">
      <div class="text-lg font-medium text-gray-800">File Content Viewer:</div>
      <div class="flex items-center gap-2" style="display: flex; align-items: center;">
        <p-button severity="secondary" text (click)="changeLayout('four')"><img src="assets/icons/fourPanel.svg" alt="Four Panel" style="width: 24px; height: 24px;"></p-button>
        <p-button severity="secondary" text (click)="changeLayout('three-hv')"><img src="assets/icons/threeColumn-firstSplit.svg" alt="Three Horizontal Vertical" style="width: 24px; height: 24px;"></p-button>
        <p-button severity="secondary" text (click)="changeLayout('three-v')"><img src="assets/icons/threePanelsView.svg" alt="Three Vertical" style="width: 24px; height: 24px;"></p-button>
        <p-button severity="secondary" text (click)="changeLayout('two')"><img src="assets/icons/twoPanels.svg" alt="Two Panel" style="width: 24px; height: 24px;"></p-button>
        <p-button icon="pi pi-check-circle" pTooltip="Approve" tooltipPosition="bottom" severity="secondary" text (click)="changeLayout('approveAction')"></p-button>
        <p-button icon="pi pi-arrow-right-arrow-left" pTooltip="Switch Sides" tooltipPosition="bottom" severity="secondary" text (click)="switchSides()"></p-button>
      </div>
    </div>
  </p-toolbar>
  <ng-container *ngIf="expandedPanelIndex === null; else expandedPanelView">
    <ng-container [ngSwitch]="layoutMode">
      <div class="grid h-screen four-panel-grid" *ngSwitchCase="'four'">
        <div class="col-6 flex flex-column">
          <div class="flex-1 border surface-border m-2 p-3 panel-scrollable" *ngFor="let panel of panelContents.slice(0,2); let i = index">
            <app-panel-header-icons [panelName]="panel" [panelIndex]="i" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(i, $event.content)" (expandPanel)="toggleExpandPanel(i)" [isExpanded]="expandedPanelIndex === i"></app-panel-header-icons>
            <app-biblio-data *ngIf="panel === 'Bibliographic Data'"></app-biblio-data>
            <app-record-actions *ngIf="panel === 'Action Recorder'" [showLayout]="false"></app-record-actions>
            <app-task-history *ngIf="panel === 'File History'" [showLayout]="false"></app-task-history>
            <app-approval-review *ngIf="panel === 'Approval Review'"></app-approval-review>
          </div>
        </div>
        <div class="col-6 flex flex-column">
          <div class="flex-1 border surface-border m-2 p-3 panel-scrollable" *ngFor="let panel of panelContents.slice(2,4); let i = index">
            <app-panel-header-icons [panelName]="panel" [panelIndex]="i + 2" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(i + 2, $event.content)" [isExpanded]="expandedPanelIndex === i" (expandPanel)="toggleExpandPanel(i + 2)"></app-panel-header-icons>
            <app-biblio-data *ngIf="panel === 'Bibliographic Data'"></app-biblio-data>
            <app-record-actions *ngIf="panel === 'Action Recorder'" [showLayout]="false"></app-record-actions>
            <app-task-history *ngIf="panel === 'File History'" [showLayout]="false"></app-task-history>
            <app-approval-review *ngIf="panel === 'Approval Review'"></app-approval-review>
          </div>
        </div>
      </div>
      <div class="expanded-panel-overlay" *ngIf="expandedPanelIndex !== null">
        <div class="expanded-panel-content">
          <app-panel-header-icons [panelName]="panelContents[expandedPanelIndex!]" [panelIndex]="expandedPanelIndex" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(expandedPanelIndex!, $event.content)" (expandPanel)="expandPanel(i)"></app-panel-header-icons>
          <app-biblio-data *ngIf="panelContents[expandedPanelIndex!] === 'Bibliographic Data'"></app-biblio-data>
          <app-record-actions *ngIf="panelContents[expandedPanelIndex!] === 'Action Recorder'" [showLayout]="false"></app-record-actions>
          <app-task-history *ngIf="panelContents[expandedPanelIndex!] === 'File History'" [showLayout]="false"></app-task-history>
          <button class="close-btn" (click)="closeExpandedPanel()">Close</button>
        </div>
      </div>
      <div class="flex h-screen three-hv" *ngSwitchCase="'three-hv'" style="display: flex; flex-direction: row;">
        <div class="border surface-border m-2 p-3 panel-scrollable" style="flex: 1; height: 100%; display: flex; flex-direction: column;">
          <app-panel-header-icons [panelName]="panelContents[2]" [panelIndex]="2" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(2, $event.content)" (expandPanel)="expandPanel(2)"></app-panel-header-icons>
          <app-biblio-data *ngIf="panelContents[2] === 'Bibliographic Data'"></app-biblio-data>
          <app-record-actions *ngIf="panelContents[2] === 'Action Recorder'" [showLayout]="false"></app-record-actions>
          <app-task-history *ngIf="panelContents[2] === 'File History'" [showLayout]="false"></app-task-history>
          <app-approval-review *ngIf="panelContents[2] === 'Approval Review'"></app-approval-review>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; height: 100%;">
          <div class="border surface-border m-2 p-3 panel-scrollable" *ngFor="let panel of panelContents.slice(0,2); let i = index" style="flex: 1;">
            <app-panel-header-icons [panelName]="panel" [panelIndex]="i" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(i, $event.content)" (expandPanel)="expandPanel(i)"></app-panel-header-icons>
            <app-biblio-data *ngIf="panel === 'Bibliographic Data'"></app-biblio-data>
            <app-record-actions *ngIf="panel === 'Action Recorder'" [showLayout]="false"></app-record-actions>
            <app-task-history *ngIf="panel === 'File History'" [showLayout]="false"></app-task-history>
            <app-approval-review *ngIf="panel === 'Approval Review'"></app-approval-review>
          </div>
        </div>
      </div>
      <div class="flex h-screen three-v" *ngSwitchCase="'three-v'">
        <div class="flex-1 border surface-border m-2 p-3 panel-scrollable" *ngFor="let panel of panelContents; let i= index">
          <app-panel-header-icons [panelName]="panel" [panelIndex]="i" [panelTypes]="panelTypes" (switchContent)="switchPanelContent($event.index, $event.content)" (expandPanel)="expandPanel(i)"></app-panel-header-icons>
          <div class="panel-body">
            <app-biblio-data *ngIf="panel === 'Bibliographic Data'"></app-biblio-data>
            <app-record-actions *ngIf="panel === 'Action Recorder'" [showLayout]="false"></app-record-actions>
            <app-task-history *ngIf="panel === 'File History'" [showLayout]="false"></app-task-history>
            <app-approval-review *ngIf="panel === 'Approval Review'"></app-approval-review>
          </div>
        </div>
      </div>
      <div class="flex h-screen two-panel" *ngSwitchCase="'two'">
        <div class="flex-1 border surface-border m-2 p-3 panel-scrollable" *ngFor="let panel of panelContents; let i = index">
          <app-panel-header-icons [panelName]="panel" [panelIndex]="i" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(i, $event.content)" (expandPanel)="expandPanel(i)"></app-panel-header-icons>
          <app-biblio-data *ngIf="panel === 'Bibliographic Data'"></app-biblio-data>
          <app-record-actions *ngIf="panel === 'Action Recorder'" [showLayout]="false"></app-record-actions>
          <app-task-history *ngIf="panel === 'File History'" [showLayout]="false"></app-task-history>
          <app-approval-review *ngIf="panel === 'Approval Review'"></app-approval-review>
        </div>
      </div>
      <div class="flex h-screen two-panel" *ngSwitchCase="'approveAction'">
        <div class="flex-1 border surface-border m-2 p-3 panel-scrollable" *ngFor="let panel of panelContents; let i = index">
          <app-panel-header-icons [panelName]="panel" [panelIndex]="i" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(i, $event.content)" (expandPanel)="expandPanel(i)"></app-panel-header-icons>
          <app-biblio-data *ngIf="panel === 'Bibliographic Data'"></app-biblio-data>
          <app-approval-recorder *ngIf="panel === 'Action Recorder'"></app-approval-recorder>
          <app-task-history *ngIf="panel === 'File History'" [showLayout]="false"></app-task-history>
          <app-approval-review *ngIf="panel === 'Approval Review'"> </app-approval-review>
        </div>
      </div>
    </ng-container>
  </ng-container>
  <ng-template #expandedPanelView>
    <div class="full-screen-panel">
      <app-panel-header-icons [panelName]="panelContents[expandedPanelIndex!]" [panelIndex]="expandedPanelIndex" [isExpanded]="true" [panelTypes]="panelTypes" (switchContent)="switchPanelContent(expandedPanelIndex!, $event.content)" (expandPanel)="toggleExpandPanel(expandedPanelIndex!)"></app-panel-header-icons>
      <app-biblio-data *ngIf="panelContents[expandedPanelIndex!] === 'Bibliographic Data'"></app-biblio-data>
      <app-record-actions *ngIf="panelContents[expandedPanelIndex!] === 'Action Recorder'" [showLayout]="false"></app-record-actions>
      <app-task-history *ngIf="panelContents[expandedPanelIndex!] === 'File History'" [showLayout]="false"></app-task-history>
      <app-approval-review *ngIf="panelContents[expandedPanelIndex!] === 'Approval Review'"></app-approval-review>
    </div>
  </ng-template>
</app-layout>
