
<app-layout [config]="layoutConfig">
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <p-tabView>
    <p-tabpanel value="aripo">
      <ng-template pTemplate="header">
        <div (click)="onTabClick($event, 'aripo-incoming')">ARIPO Notifications</div>
      </ng-template>
      <app-package-stats [packageStats]="aripoStats" (statSelected)="onStatSelect($event)" [selectedStat]="'TOTAL IN MONTH'"></app-package-stats>
      <app-configurable-filter-bar [filters]="aripoFilterConfigs" [showClearAll]="true" [showApplyButton]="true" [showFilterSelector]="true" [filterSelectorPlaceholder]="'Select filters to display'" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)" [showSearchBar]="true" [searchBar]="searchBar" (filterSearch)="filterSearch($event)" [searchLabel]="'Search File Id'" [showDownloadIcon]="false" [appliedFilters]="appliedFilters" [clearAllLabel]="'Clear All'" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-configurable-filter-bar>
      <p-tabView>
        <p-tabpanel value="aripo-incoming">
          <ng-template pTemplate="header">
            <div (click)="onHeaderClick($event, 'aripo-incoming')">ARIPO Incoming Notifications</div>
          </ng-template>
          <app-table [columns]="aripoIncomingTableColumns" [data]="aripoIncomingTableData" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"> </app-table>
        </p-tabpanel>
        <p-tabpanel value="aripo-outgoing">
          <ng-template pTemplate="header">
            <div (click)="onHeaderClick($event, 'aripo-outgoing')">ARIPO Outgoing Notifications </div>
          </ng-template>
          <app-table [columns]="aripoOutgoingTableColumns" [data]="aripoOutgoingTableData" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"></app-table>
        </p-tabpanel>
      </p-tabView>
    </p-tabpanel>
    <p-tabpanel value="hague">
      <ng-template pTemplate="header">
        <div (click)="onTabClick($event, 'hague-incoming')">Hague Notifications</div>
      </ng-template>
      <p-tabView>
        <p-tabpanel value="hague-incoming">
          <ng-template pTemplate="header">
            <div (click)="onHeaderClick($event, 'hague-incoming')">Hague Incoming Notifications</div>
          </ng-template>
        </p-tabpanel>
        <p-tabpanel value="hague-outgoing">
          <ng-template pTemplate="header">
            <div (click)="onHeaderClick($event, 'hague-outgoing')">Hague Outgoing Notifications </div>
          </ng-template>
        </p-tabpanel>
      </p-tabView>
    </p-tabpanel>
    <p-tabpanel value="madrid">
      <ng-template pTemplate="header">
        <div (click)="onTabClick($event, 'madrid-incoming')">Madrid Notifications</div>
      </ng-template>
      <p-tabView>
        <p-tabpanel value="madrid-incoming">
          <ng-template pTemplate="header">
            <div (click)="onHeaderClick($event, 'madrid-incoming')">Madrid Incoming Notifications</div>
          </ng-template>
        </p-tabpanel>
        <p-tabpanel value="madrid-outgoing">
          <ng-template pTemplate="header">
            <div (click)="onHeaderClick($event, 'madrid-outgoing')">Madrid Outgoing Notifications</div>
          </ng-template>
        </p-tabpanel>
      </p-tabView>
    </p-tabpanel>
    <p-tabpanel value="office">
      <ng-template pTemplate="header">
        <div (click)="onTabClick($event, 'office-incoming')">My Office  Notifications</div>
      </ng-template>
    </p-tabpanel>
  </p-tabView>
</app-layout>
