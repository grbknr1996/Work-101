
<app-layout [config]="layoutConfig">
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <app-package-stats [packageStats]="hagueStats" (statSelected)="onStatSelect($event)" [selectedStat]="hagueStatSelected"></app-package-stats>
  <app-configurable-filter-bar [filters]="hagueIncomingFilterConfigs" [disabled]="hagueActiveIndex==0? false: true" [showClearAll]="true" [showApplyButton]="true" [showFilterSelector]="true" [filterSelectorPlaceholder]="'Select filters to display'" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)" [showSearchBar]="true" [searchBar]="searchBar" (filterSearch)="filterSearch($event)" [searchLabel]="'Search IRN/ Bulletin'" [showDownloadIcon]="false" [appliedFilters]="appliedFilters" [clearAllLabel]="'Clear All'" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-configurable-filter-bar>
  <app-configurable-filter-bar [filters]="hagueOutgoingFilterConfigs" [disabled]="hagueActiveIndex==0? true: false" [showClearAll]="true" [showApplyButton]="true" [showFilterSelector]="true" [filterSelectorPlaceholder]="'Select filters to display'" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)" [showSearchBar]="true" [searchBar]="searchBar" (filterSearch)="filterSearch($event)" [searchLabel]="'Search IRN'" [showDownloadIcon]="false" [appliedFilters]="appliedFilters" [clearAllLabel]="'Clear All'" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-configurable-filter-bar>
  <p-tabView [(activeIndex)]="hagueActiveIndex">
    <p-tabpanel value="hague-incoming">
      <ng-template pTemplate="header">
        <div (click)="onHeaderClick($event, 'hague-incoming')">Hague Incoming Notifications</div>
      </ng-template>
      <app-table [columns]="hagueIncomingTableColumns" [data]="hagueIncomingTableData" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"> </app-table>
    </p-tabpanel>
    <p-tabpanel value="hague-outgoing">
      <ng-template pTemplate="header">
        <div (click)="onHeaderClick($event, 'hague-outgoing')">Hague Outgoing Notifications</div>
      </ng-template>
      <app-table [columns]="hagueOutgoingTableColumns" [data]="hagueOutgoingTableData" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"></app-table>
    </p-tabpanel>
  </p-tabView>
</app-layout>
