
<app-layout [config]="layoutConfig">
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <app-package-stats [packageStats]="hagueStats" (statSelected)="onStatSelect($event)" [selectedStat]="hagueStatSelected"></app-package-stats>
  <app-configurable-filter-bar [filters]="hagueIncomingFilterConfigs" [disabled]="hagueActiveIndex==0? false: true" [showClearAll]="true" [showApplyButton]="true" [showFilterSelector]="true" [filterSelectorPlaceholder]="'notifications.hague.filter.placeHolder'|translate" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)" [showSearchBar]="true" [searchBar]="searchBar" (filterSearch)="filterSearch($event)" [searchLabel]="'notifications.hague.filter.incomingSearch'|translate" [showDownloadIcon]="false" [appliedFilters]="appliedFilters" [clearAllLabel]="'common.components.filter.clearAll'|translate" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-configurable-filter-bar>
  <app-configurable-filter-bar [filters]="hagueOutgoingFilterConfigs" [disabled]="hagueActiveIndex==0? true: false" [showClearAll]="true" [showApplyButton]="true" [showFilterSelector]="true" [filterSelectorPlaceholder]="'notifications.hague.filter.placeHolder'|translate" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)" [showSearchBar]="true" [searchBar]="searchBar" (filterSearch)="filterSearch($event)" [searchLabel]="'notifications.hague.filter.outgoingSearch'|translate" [showDownloadIcon]="false" [appliedFilters]="appliedFilters" [clearAllLabel]="'common.components.filter.clearAll'|translate" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-configurable-filter-bar>
  <p-tabs [value]="hagueActiveIndex">
    <p-tablist>
      <p-tab value="hague-incoming" (click)="onHeaderClick($event, 'hague-incoming')">{{"notifications.hague.incoming.header"|translate}}</p-tab>
      <p-tab value="hague-outgoing" (click)="onHeaderClick($event, 'hague-incoming')">{{"notifications.hague.outgoing.header"|translate}}   </p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="hague-incoming">
        <app-table [columns]="hagueIncomingTableColumns" [data]="hagueIncomingTableData" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"> </app-table>
      </p-tabpanel>
      <p-tabpanel value="hague-outgoing">
        <app-table [columns]="hagueOutgoingTableColumns" [data]="hagueOutgoingTableData" (actionClick)="onActionClick($event.action, $event.item)" [showClearButton]="false" [showSearch]="false"></app-table>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</app-layout>
