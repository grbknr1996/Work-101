
<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <div class="p-4">
    <!-- Header Section-->
    <div class="mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">{{ 'userManagement.groups.title' | translate }}</h1>
        <p class="text-gray-600">{{ 'userManagement.groups.manageGroups' | translate }}</p>
      </div>
      <button class="p-button-primary" pButton [label]="'userManagement.groups.createGroup' | translate" icon="pi pi-plus" (click)="openCreateGroupDialog()"></button>
    </div>
    <!-- Filter Section with Button-->
    <div class="mb-4 flex justify-end items-center gap-3 p-3 rounded" style="background: #e5f3f7">
      <app-configurable-filter #configurableFilter [filters]="filterConfigs" [showFilterSelector]="true" [filterSelectorPlaceholder]="'notifications.acknowledge.filter.placeHolder'|translate" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)"></app-configurable-filter>
      <button class="p-button-text" pButton icon="pi pi-download" style="color: var(--p-button-outlined-secondary-color)"></button>
    </div>
    <!-- Filter Chips Section with Gradient Background-->
    <div class="mb-4">
      <app-filter-chips [appliedFilters]="appliedFilters" [showClearAll]="true" [clearAllLabel]="'userManagement.groups.clearAll' | translate" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-filter-chips>
    </div>
    <!-- Table Section-->
    <div class="relative">
      <app-table [columns]="tableColumns" [data]="filteredGroups" [paginator]="true" [rows]="pageSize" [totalRecords]="totalRecords" [showCurrentPageReport]="true" [currentPageReportTemplate]="'userManagement.groups.showingGroups' | translate" [rowsPerPageOptions]="[10, 25, 50]" [emptyMessage]="'userManagement.groups.noGroupsFound' | translate" [lazy]="true" (actionClick)="onTableAction($event)" (onLazyLoad)="onLazyLoad($event)"></app-table>
      <!-- Delete Group Confirmation Dialog-->
      <p-dialog class="delete-dialog" [header]="'userManagement.groups.deleteGroup' | translate" [(visible)]="deleteGroupDialog" [modal]="true">
        <div class="p-fluid" *ngIf="selectedGroup">
          <div class="mb-4">
            <p class="text-lg">{{ 'userManagement.groups.deleteGroupConfirm' | translate: {groupName: selectedGroup.groupName} }}</p>
            <p class="text-red-600 mt-2">{{ 'userManagement.groups.deleteGroupWarning' | translate }}</p>
          </div>
        </div>
        <ng-template pTemplate="footer">
          <button class="p-button-text" pButton pRipple [label]="'userManagement.groups.cancel' | translate" icon="pi pi-times" (click)="deleteGroupDialog = false"></button>
          <button class="p-button-danger" pButton pRipple [label]="'userManagement.groups.delete' | translate" icon="pi pi-trash" (click)="deleteGroup()"></button>
        </ng-template>
      </p-dialog>
    </div>
  </div>
</app-layout>
