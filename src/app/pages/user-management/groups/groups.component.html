
<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <div class="p-4">
    <!-- Header Section-->
    <div class="mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">User Groups</h1>
        <p class="text-gray-600">Manage and view all user groups in the system</p>
      </div>
      <button class="p-button-primary" pButton label="Create Group" icon="pi pi-plus" (click)="openCreateGroupDialog()"></button>
    </div>
    <!-- Filter Section with Button-->
    <div class="mb-4 flex justify-end items-center">
      <div class="flex items-center gap-3">
        <app-configurable-filter #configurableFilter [filters]="filterConfigs" [showFilterSelector]="true" [filterSelectorPlaceholder]="'Select filters to display'" (filterChange)="onFilterChange($event)" (filterCleared)="onFilterCleared()" (filterApplied)="onFilterApplied($event)" (appliedFiltersChange)="onAppliedFiltersChange($event)"></app-configurable-filter>
        <button class="p-button-text" pButton icon="pi pi-download" style="color:var(--p-button-outlined-secondary-color)"></button>
      </div>
    </div>
    <!-- Filter Chips Section with Gradient Background-->
    <div class="mb-4">
      <app-filter-chips [appliedFilters]="appliedFilters" [showClearAll]="true" [clearAllLabel]="'Clear All'" [getDisplayValue]="getFilterDisplayValue.bind(this)" (chipRemove)="removeFilterChip($event)" (clearAll)="clearAllFilters()"></app-filter-chips>
    </div>
    <!-- Table Section-->
    <div class="relative">
      <app-table [columns]="tableColumns" [data]="filteredGroups" [paginator]="true" [rows]="pageSize" [totalRecords]="totalRecords" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} groups" [rowsPerPageOptions]="[10, 25, 50]" emptyMessage="No groups found" [lazy]="true" (actionClick)="onTableAction($event)" (onLazyLoad)="onLazyLoad($event)"></app-table>
      <!-- Delete Group Confirmation Dialog-->
      <p-dialog header="Delete Group" [(visible)]="deleteGroupDialog" [style]="{ width: '450px' }" [modal]="true">
        <div class="p-fluid" *ngIf="selectedGroup">
          <div class="mb-4">
            <p class="text-lg">Are you sure you want to delete the group "{{ selectedGroup.groupName }}"?</p>
            <p class="text-red-600 mt-2">This action cannot be undone. All members will be removed from this group.</p>
          </div>
        </div>
        <ng-template pTemplate="footer">
          <button class="p-button-text" pButton pRipple label="Cancel" icon="pi pi-times" (click)="deleteGroupDialog = false"></button>
          <button class="p-button-danger" pButton pRipple label="Delete" icon="pi pi-trash" (click)="deleteGroup()"></button>
        </ng-template>
      </p-dialog>
    </div>
  </div>
</app-layout>
