
<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  <div class="create-user-container">
    <h1 class="form-title">{{ isEditMode ? 'Edit User' : 'Create User' }}</h1>
    <app-configurable-stepper [steps]="steps" [activeStep]="activeStep" (stepChange)="onStepChange($event)"></app-configurable-stepper>
    <form [formGroup]="userForm">
      <div class="step-content">
        <ng-container [ngSwitch]="activeStep">
          <app-basic-info-form *ngSwitchCase="0" [formGroup]="userForm.get('basicInfo')"></app-basic-info-form>
          <app-group-assignment *ngSwitchCase="1" [availableGroups]="availableGroups" [assignedGroups]="userForm.get('assignedGroups').value" [currentAvailablePage]="currentGroupsPage" [totalAvailablePages]="totalGroupsPages" [totalAvailableGroups]="totalGroupsCount" (assignedGroupsChange)="onAssignedGroupsChange($event)" (availablePageChange)="onGroupsPageChange($event)">
            <div class="loading-groups" *ngIf="isLoadingGroups" style="text-align: center; padding: 20px; color: #666;">
              <p>Loading available groups...</p>
            </div>
            <div class="error-groups" *ngIf="groupsLoadError" style="text-align: center; padding: 20px; color: #dc3545;">
              <p>Failed to load groups. Please try again later.</p>
              <button class="p-button-sm" pButton type="button" label="Retry" icon="pi pi-refresh" (click)="retryLoadGroups()"></button>
            </div>
            <div class="groups-search" *ngIf="!isLoadingGroups &amp;&amp; !groupsLoadError &amp;&amp; totalGroupsCount &gt; 0" style="text-align: center; padding: 10px; color: #666; font-size: 0.9em;">
              <input type="text" placeholder="Search groups..." [(ngModel)]="groupsSearchTerm" (keyup.enter)="onGroupsSearch(groupsSearchTerm)" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; width: 250px; margin-right: 10px;">
              <button class="p-button-sm" pButton type="button" label="Search" icon="pi pi-search" (click)="onGroupsSearch(groupsSearchTerm)"></button>
              <button class="p-button-sm p-button-outlined" pButton type="button" label="Clear" icon="pi pi-times" (click)="onGroupsSearch('')" style="margin-left: 5px;" *ngIf="groupsSearchTerm"></button>
            </div>
          </app-group-assignment>
          <div class="unit-step-card" *ngSwitchCase="2">
            <div class="card-header">
              <h2>Unit Assignment</h2>
            </div>
            <div class="card-content">
              <div class="form-field">
                <label for="unit">Select Unit</label>
                <input type="text" id="unit" formControlName="unit" placeholder="Enter unit name">
              </div>
            </div>
          </div>
          <div class="security-step-card" *ngSwitchCase="3" [formGroup]="userForm.get('security')">
            <div class="card-header">
              <h2>Security Settings</h2>
            </div>
            <div class="card-content">
              <div class="form-field">
                <label class="checkbox-label">
                  <input type="checkbox" formControlName="requirePasswordChange"><span class="checkbox-text">Require password change on first login</span>
                </label>
              </div>
              <div class="form-field">
                <label class="checkbox-label">
                  <input type="checkbox" formControlName="enableTwoFactor"><span class="checkbox-text">Enable two-factor authentication</span>
                </label>
              </div>
            </div>
          </div>
          <app-review-step *ngSwitchCase="4" [basicInfo]="userForm.get('basicInfo').value" [assignedGroups]="userForm.get('assignedGroups').value" [unit]="userForm.get('unit').value" [security]="userForm.get('security').value"></app-review-step>
        </ng-container>
      </div>
      <div class="step-actions">
        <div class="step-actions-left">
          <button class="p-button-secondary" pButton type="button" label="Previous" (click)="prevStep()" *ngIf="activeStep &gt; 0"></button>
        </div>
        <div class="step-actions-divider" *ngIf="activeStep &gt; 0 &amp;&amp; activeStep &lt; steps.length - 1"></div>
        <div class="step-actions-right">
          <button class="p-button-primary" pButton type="button" label="Next" (click)="nextStep()" *ngIf="activeStep &lt; steps.length - 1" [disabled]="!canProceed()"></button>
          <button class="p-button-success" pButton type="button" [label]="isEditMode ? 'Update User' : 'Create User'" (click)="saveUser()" *ngIf="activeStep === steps.length - 1"></button>
        </div>
      </div>
    </form>
  </div>
</app-layout>
