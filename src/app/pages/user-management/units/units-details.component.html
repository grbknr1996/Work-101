
<div class="unit-details-container" style="max-width: 1100px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
  <div class="role-selector" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; justify-content: flex-start;">
    <p-buttonGroup>
      <button pButton *ngFor="let role of roleLabels; let i = index" [label]="role.label" [class.p-button-outlined]="selectedRoleIndex !== i" [class.p-button-primary]="selectedRoleIndex === i" (click)="selectRole(i)" style="min-width: 120px; font-weight: 500;"></button>
    </p-buttonGroup>
  </div>
  <p-tabView [(activeIndex)]="selectedTabIndex">
    <p-tabPanel header="Users">
      <button class="p-button-sm p-button-primary" pButton icon="pi pi-plus" label="Add User" style="margin-bottom: 1rem;" (click)="openAddUserDialog()"></button>
      <p-table [value]="getSelectedRoleUsers()" *ngIf="unit">
        <ng-template pTemplate="header">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th style="width: 60px;">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user let-i="rowIndex">
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <button class="p-button-text p-button-sm" pButton icon="pi pi-times" (click)="removeUser(selectedRole, i)"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
      <p-dialog header="Add User" [(visible)]="addUserDialogVisible" [modal]="true" [style]="{ width: '400px' }">
        <div class="p-fluid">
          <div class="p-field">
            <label for="userName">Name</label>
            <input id="userName" type="text" pInputText [(ngModel)]="newUser.name">
          </div>
          <div class="p-field">
            <label for="userEmail">Email</label>
            <input id="userEmail" type="email" pInputText [(ngModel)]="newUser.email">
          </div>
        </div>
        <ng-template pTemplate="footer">
          <button class="p-button-text" pButton label="Cancel" (click)="addUserDialogVisible = false"></button>
          <button class="p-button-primary" pButton label="Add" (click)="addUserConfirm()"></button>
        </ng-template>
      </p-dialog>
    </p-tabPanel>
    <p-tabPanel header="Permissions">
      <div class="grid">
        <div class="col-12">
          <label class="block mb-2 font-medium">Permission Sets</label>
          <p-multiSelect class="w-full" [options]="availablePermissions" [(ngModel)]="selectedPermissions" optionLabel="label" [filter]="true" placeholder="Select Permission Sets" [panelStyle]="{ minWidth: '600px', width: '80vw', maxWidth: '700px', maxHeight: '400px', overflowX: 'auto' }" [virtualScroll]="true" [virtualScrollItemSize]="34" [showToggleAll]="true" appendTo="body">
            <ng-template let-permission pTemplate="item">
              <div class="flex items-center justify-between p-2" style="min-width: 350px"><span class="font-semibold">{{ permission.label }}</span><span class="text-gray-500 text-xs ml-4 whitespace-nowrap">
                  {{ permission.permissions.length }} permission{{
                  permission.permissions.length > 1 ? "s" : ""
                  }}</span></div>
            </ng-template>
          </p-multiSelect>
        </div>
        <div class="col-12 mt-4">
          <div class="bg-gray-50 p-4 rounded-lg">
            <h4 class="font-semibold mb-4">Selected Permissions</h4>
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
              <div class="p-4 bg-white rounded-lg shadow-sm" *ngFor="let permission of selectedPermissions">
                <div class="font-medium text-lg mb-2">{{ permission.label }}</div>
                <div class="text-sm text-gray-600">
                  <div class="flex flex-wrap gap-2"><span class="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs" *ngFor="let perm of permission.permissions">{{ perm }}</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-tabPanel>
    <p-tabPanel header="Actions">
      <app-unit-actions-assignment [processes]="processes" [selectedActions]="selectedActions" (selectedActionsChange)="onSelectedActionsChange($event)"></app-unit-actions-assignment>
    </p-tabPanel>
  </p-tabView>
</div>
<ng-template #noUnit> </ng-template>
