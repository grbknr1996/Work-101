
<div class="units-tree-container">
  <p-tree [value]="treeNodes" selectionMode="single" [(selection)]="selectedNode" (onNodeSelect)="onNodeSelect($event)" (onNodeUnselect)="onNodeUnselect($event)" [style]="{ width: '100%', height: '80vh' }" [filter]="true" filterPlaceholder="Search units..." styleClass="units-tree-scrollable">
    <ng-template pTemplate="header">
      <button (click)="toggleExpandCollapse()" [title]="allExpanded ? 'Collapse All' : 'Expand All'" style="margin-left: 0.5rem"><i class="pi pi-sitemap" [ngStyle]="{ color: allExpanded ? '#1976d2' : '#b0b0b0' }"></i></button><span style="font-size: 0.8em; color: #888; margin-left: 0.5rem; vertical-align: middle">{{ allExpanded ? 'Collapse all' : 'Expand all' }}</span>
    </ng-template>
    <ng-template let-node pTemplate="default">
      <div style="display: flex; align-items: center; gap: 0.5rem; width: 100%">
        <!-- Main Content Area-->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem">
          <!-- Unit Name with Icon-->
          <div style="display: flex; align-items: center; gap: 0.5rem"><i class="pi" [ngClass]="getLevelChipInfo(node).iconClass" style="font-size: 0.8rem; color: var(--p-primary-color)"></i><span [style.font-weight]="selectedNode?.key === node.key ? '700' : '500'" style="font-size: 0.8rem; color: var(--p-primary-color)">{{ node.label }}</span></div>
          <!-- Sub-text with count-->
          <div style="display: flex; align-items: center; gap: 0.5rem"><span style="font-size: 0.7rem; color: #666; font-style: italic">{{ getSubUnitCountText(node) }}</span></div>
        </div>
        <!-- Action Buttons-->
        <div style="display: flex; gap: 0.25rem">
          <!-- Add Button (only show if not Section level)-->
          <button class="p-button-text p-button-sm" *ngIf="getLevelChipInfo(node).iconClass !== 'pi pi-list'" pButton icon="pi pi-plus" (click)="addNode(node, $event)" title="Add Sub-unit" style="min-width: 24px; height: 24px"></button>
          <!-- Delete Button-->
          <button class="p-button-text p-button-sm" pButton icon="pi pi-trash" (click)="deleteNode(node, $event)" title="Delete Unit" style="min-width: 24px; height: 24px;color:red"></button>
        </div>
      </div>
    </ng-template>
  </p-tree>
</div>
<style>
  .units-tree-scrollable {
    height: 80vh !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }
  
  .units-tree-scrollable .p-tree {
    height: 100% !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }
  
          .units-tree-scrollable .p-tree-container {
            height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
          }
  
</style>
<!-- Confirmation Dialog-->
<p-confirmDialog></p-confirmDialog>
