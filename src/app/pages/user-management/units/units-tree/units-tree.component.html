
<div class="units-tree-container">
  <p-tree [value]="treeNodes" selectionMode="single" [(selection)]="selectedNode" (onNodeSelect)="onNodeSelect($event)" (onNodeUnselect)="onNodeUnselect($event)" [filter]="true" [filterPlaceholder]="'userManagement.units.searchUnits' | translate" styleClass="units-tree-scrollable">
    <ng-template pTemplate="header">
      <button class="units-tree-header" (click)="toggleExpandCollapse()" [title]="allExpanded ? ('userManagement.units.collapseAll' | translate) : ('userManagement.units.expandAll' | translate)"><i class="pi pi-sitemap" [ngClass]="allExpanded ? 'units-tree-expand-icon' : 'units-tree-collapse-icon'"></i></button><span class="units-tree-header-text">{{ allExpanded ? ('userManagement.units.collapseAllText' | translate) : ('userManagement.units.expandAllText' | translate) }}</span>
    </ng-template>
    <ng-template let-node pTemplate="default">
      <div class="units-tree-node-container">
        <!-- Main Content Area-->
        <div class="units-tree-main-content">
          <!-- Unit Name with Icon-->
          <div class="units-tree-name-container"><i class="pi units-tree-icon" [ngClass]="getLevelChipInfo(node).iconClass"></i><span class="units-tree-label" [ngClass]="selectedNode?.key === node.key ? 'units-tree-label-selected' : 'units-tree-label-unselected'">{{ node.label }}</span></div>
          <!-- Sub-text with count-->
          <div class="units-tree-subtext-container"><span class="units-tree-subtext">{{ getSubUnitCountText(node) }}</span></div>
        </div>
        <!-- Action Buttons-->
        <div class="units-tree-actions">
          <!-- Add Button (only show if not Section level)-->
          <button class="p-button-text p-button-sm units-tree-action-btn" *ngIf="getLevelChipInfo(node).iconClass !== 'pi pi-list'" pButton icon="pi pi-plus" (click)="addNode(node, $event)" [title]="'userManagement.units.addSubUnit' | translate"></button>
          <!-- Delete Button-->
          <button class="p-button-text p-button-sm units-tree-delete-btn" pButton icon="pi pi-trash" (click)="deleteNode(node, $event)" [title]="'userManagement.units.deleteUnit' | translate"></button>
        </div>
      </div>
    </ng-template>
  </p-tree>
</div>
<!-- Confirmation Dialog-->
<p-confirmDialog></p-confirmDialog>
