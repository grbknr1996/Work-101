<app-layout><app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs><!-- Mobile hamburger menu--><div class="mobile-menu-btn" *ngIf="isMobile" (click)="toggleMobileMenu()"><i class="pi pi-bars"></i><span>{{ 'userManagement.units.unitsTree' | translate }}</span></div><!-- Mobile overlay--><div class="mobile-overlay" *ngIf="isMobile &amp;&amp; showTree" (click)="closeMobileMenu()"></div><div class="units-page-container"><!-- Desktop sidebar (always rendered, conditionally shown)--><div class="units-sidebar" *ngIf="!isMobile" [style.display]="showTree ? 'flex' : 'none'"><!-- Units Tree Title--><h1>{{ 'userManagement.units.unitsTree' | translate }}</h1><div class="button-container"><button class="p-button-sm p-button-primary" pButton icon="pi pi-plus" [label]="'userManagement.units.newRootUnit' | translate" (click)="createNewRootUnit()"></button></div><div class="tree-container"><app-units-tree #unitsTree [searchText]="searchText" [filter]="false" (nodeSelected)="onNodeSelected($event)"></app-units-tree></div></div><!-- Mobile sidebar (mobile only)--><div class="units-sidebar" *ngIf="isMobile" [class.mobile-sidebar]="isMobile" [class.show]="isMobile &amp;&amp; showTree"><!-- Mobile close button--><div class="mobile-close-btn" (click)="closeMobileMenu()"><i class="pi pi-times"></i></div><!-- Units Tree Title--><h1>{{ 'userManagement.units.unitsTree' | translate }}</h1><div class="button-container"><button class="p-button-sm p-button-primary" pButton icon="pi pi-plus" [label]="'userManagement.units.newRootUnit' | translate" (click)="createNewRootUnit()"></button></div><div class="tree-container"><app-units-tree #unitsTree [searchText]="searchText" [filter]="false" (nodeSelected)="onNodeSelected($event)"></app-units-tree></div></div><!-- Toggle button and divider (desktop only)--><div class="toggle-container" *ngIf="!isMobile"><p-divider layout="vertical"></p-divider><button class="sidebar-toggle-btn" (click)="showTree = !showTree"><i class="pi pi-arrow-right-arrow-left"></i></button></div><!-- Main content area - takes full width when tree is hidden--><div class="main-content" [style.width]="showTree ? 'auto' : '100%'"><ng-container *ngIf="selectedUnit; else noSelection"><app-unit-details [unit]="selectedUnit" [unitCategory]="selectedUnitCategory" (unitUpdated)="onUnitUpdated()"></app-unit-details></ng-container><ng-template #noSelection><div class="no-selection-message">{{ 'userManagement.units.selectNodeToView' | translate }}</div></ng-template></div></div></app-layout>
